# Local infrastructure for development: Postgres + S3-compatible storage.
# Usage: docker compose up -d   (then: npm run db:migrate)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appbuilder
      POSTGRES_PASSWORD: appbuilder
      POSTGRES_DB: appbuilder
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appbuilder"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/appbuilder;
      "

volumes:
  postgres-data:
  minio-data:
